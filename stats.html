<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإحصائيات — مِشكاة</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="vendor/supabase.min.js?v=4"></script>
<script src="supabase-config.js?v=4"></script>
<script src="auth.js?v=4"></script>
<style>
:root{
  --bg:#10140E; --bg2:#141A12; --bg3:#0C0F0A;
  --slate:#242A1C; --forest:#4A5A35; --gold:#E3C268; --gold-bright:#F2D98C;
  --mist:#C9C4A8; --ivory:#F8F3E3; --line:rgba(227,194,104,.16);
  --red:#E8836E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ivory);font-family:'Tajawal',sans-serif;line-height:1.8;min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:rgba(16,20,14,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:13px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 20px rgba(227,194,104,.4)}
.brand .t{color:var(--gold)}
nav a{color:var(--mist);text-decoration:none;font-size:14px;margin-inline-start:20px;transition:color .2s}
nav a:hover{color:var(--gold-bright)}
.page{padding:36px 0 60px}
.page h1{font-family:'Amiri',serif;font-size:34px;text-align:center;color:var(--gold)}
.page .sub{text-align:center;color:var(--mist);font-size:14px;margin:6px 0 30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:linear-gradient(165deg,var(--slate) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card .num{font-family:'Amiri',serif;font-size:36px;font-weight:700;color:var(--gold-bright);line-height:1.3}
.card .lbl{font-size:13.5px;color:var(--mist)}
.card small{display:block;font-size:11.5px;color:var(--forest)}
.chart-wrap{margin-top:34px;background:linear-gradient(165deg,var(--slate) 0%,var(--bg2) 100%);border:1px solid var(--line);border-radius:18px;padding:22px}
.chart-wrap h2{font-size:17px;font-weight:800;margin-bottom:18px;color:var(--ivory)}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bar i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));min-height:2px;transition:height .6s ease;box-shadow:0 0 14px rgba(227,194,104,.3)}
.bar span{font-size:10px;color:var(--mist)}
.bar .day{font-size:10.5px;color:var(--mist)}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
th{color:var(--gold);text-align:right;font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid rgba(227,194,104,.08);color:var(--ivory)}
td.muted{color:var(--mist)}
.guard{max-width:480px;margin:80px auto;text-align:center;background:linear-gradient(165deg,var(--slate),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:38px 26px}
.guard .ic{font-size:44px}
.guard h2{font-size:20px;margin:12px 0 6px}
.guard p{color:var(--mist);font-size:14px}
.guard .btn{margin-top:18px;display:inline-block;padding:12px 26px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#B08D3E);color:#10140E;font-weight:800;text-decoration:none;border:none;font-family:'Tajawal';font-size:15px;cursor:pointer}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;flex-wrap:wrap}
.toolbar h2{font-size:17px;font-weight:800}
.toolbar button{padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(227,194,104,.08);color:var(--gold-bright);font-family:'Tajawal';font-size:13.5px;cursor:pointer;transition:background .2s}
.toolbar button:hover{background:rgba(227,194,104,.18)}
.chip-user{color:var(--gold-bright);font-weight:700;font-size:14px}
.chip-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;margin-inline-end:7px;border:1.5px solid var(--gold)}
.chip-avatar.ph{background:linear-gradient(135deg,var(--gold),#B08D3E);color:#10140E;font-size:12.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;margin-inline-end:7px;vertical-align:middle;border:none}
.users-tb{margin-top:38px}
.search{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(16,20,14,.6);color:var(--ivory);font-family:'Tajawal';font-size:13.5px;width:230px}
.search:focus{outline:none;border-color:var(--gold)}
.search::placeholder{color:var(--mist)}
.tbl-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;border:1.5px solid var(--gold);margin-inline-end:9px}
.tbl-avatar.ph{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),#B08D3E);color:#10140E;font-weight:900;font-size:14px;width:32px;height:32px;border-radius:50%;margin-inline-end:9px;vertical-align:middle;border:none}
.badge{padding:3px 12px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.admin{background:rgba(227,194,104,.15);color:var(--gold-bright);border:1px solid rgba(227,194,104,.35)}
.badge.user{background:rgba(244,241,232,.06);color:var(--mist);border:1px solid var(--line)}
.chip-logout{background:none;border:1px solid var(--line);color:var(--mist);border-radius:99px;padding:5px 14px;margin-inline-start:10px;font-family:'Tajawal';font-size:12.5px;cursor:pointer}
.chip-logout:hover{color:var(--red);border-color:var(--red)}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="brand"><img src="assets/icon.png" alt="مِشكاة"><span>مِشكاة<span class="t">.</span> الإحصائيات</span></div>
    <nav>
      <a href="index.html">العودة للموقع</a>
      <a href="#" id="statsLink" style="display:none">الإحصائيات</a>
      <span id="userChip"></span>
    </nav>
  </div>
</header>

<div class="container page">
  <div id="statsApp" class="hidden">
    <h1>لوحة الإحصائيات</h1>
    <p class="sub">أرقام الحسابات والتحميلات لحظياً</p>

    <div class="cards" id="cards"></div>

    <div class="chart-wrap">
      <h2>التحميلات — آخر 14 يوماً</h2>
      <div class="bars" id="bars"></div>
    </div>

    <div class="toolbar">
      <h2>آخر التحميلات</h2>
      <button onclick="initStats()">تحديث ↻</button>
    </div>
    <table id="dlTable">
      <thead><tr><th>المستخدم</th><th>الوقت</th><th>الحساب</th></tr></thead>
      <tbody></tbody>
    </table>

    <div class="toolbar users-tb">
      <h2>الحسابات المسجلة</h2>
      <input id="userSearch" class="search" type="search" placeholder="ابحث بالبريد الإلكتروني..." oninput="renderUsers()">
    </div>
    <table id="usersTable">
      <thead><tr><th>المستخدم</th><th>البريد الإلكتروني</th><th>سُجّل في</th><th>آخر ظهور</th><th>الصلاحية</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="statsGuard" class="hidden"></div>
</div>

<script>
function renderStatsGuard() {
  document.getElementById('statsApp').classList.add('hidden');
  const guard = document.getElementById('statsGuard');
  guard.classList.remove('hidden');
  guard.innerHTML = !configured
    ? '<div class="guard"><div class="ic">🔌</div><h2>النظام غير مفعّل</h2><p>لم تُضبط مفاتيح Supabase بعد.</p></div>'
    : currentUser
      ? '<div class="guard"><div class="ic">⛔</div><h2>لا تملك الصلاحية</h2><p>هذه اللوحة مخصصة لمشرفي مِشكاة فقط.</p></div>'
      : '<div class="guard"><div class="ic">🔐</div><h2>سجّل دخولك أولاً</h2><p>هذه اللوحة مخصصة لمشرفي مِشكاة فقط.</p><button class="btn" onclick="openLoginModal()">دخول المشرف</button></div>';
}

async function initStats() {
  if (!currentUser || !isAdmin) { renderStatsGuard(); return; }
  document.getElementById('statsGuard').classList.add('hidden');
  document.getElementById('statsApp').classList.remove('hidden');
  const now = new Date();
  const iso = (d) => d.toISOString();
  const dayStart = new Date(now); dayStart.setHours(0, 0, 0, 0);
  const weekAgo = new Date(now.getTime() - 7 * 864e5);
  const fiveMin = new Date(now.getTime() - 5 * 60e3);

  const { count: totalAccounts } = await supabase.from('profiles').select('*', { count: 'exact', head: true });
  const { count: dlAll } = await supabase.from('downloads').select('*', { count: 'exact', head: true });
  const { count: dlToday } = await supabase.from('downloads').select('*', { count: 'exact', head: true }).gte('created_at', iso(dayStart));
  const { count: activeToday } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).gte('last_seen_at', iso(dayStart));
  const { count: activeWeek } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).gte('last_seen_at', iso(weekAgo));
  const { count: onlineNow } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).gte('last_seen_at', iso(fiveMin));

  const cards = [
    ['👥', totalAccounts || 0, 'إجمالي الحسابات', ''],
    ['⬇️', dlAll || 0, 'إجمالي التحميلات', ''],
    ['📅', dlToday || 0, 'تحميلات اليوم', ''],
    ['🟢', onlineNow || 0, 'متصلون الآن', 'خلال 5 دقائق'],
    ['🌞', activeToday || 0, 'نشطون اليوم', 'آخر ظهور اليوم'],
    ['🗓️', activeWeek || 0, 'نشطون أسبوعياً', 'آخر 7 أيام']
  ];
  document.getElementById('cards').innerHTML = cards.map(c =>
    '<div class="card"><div class="num">' + c[1] + '</div><div class="lbl">' + c[2] + '</div><small>' + c[3] + '</small></div>'
  ).join('');

  const { data: recent } = await supabase.from('downloads')
    .select('created_at, user_id, profiles(email)').order('created_at', { ascending: false }).limit(20);
  const tbody = document.querySelector('#dlTable tbody');
  tbody.innerHTML = recent && recent.length
    ? recent.map(d => {
        const email = d.profiles && d.profiles.email ? d.profiles.email : 'زائر';
        const t = new Date(d.created_at).toLocaleString('ar', { dateStyle: 'short', timeStyle: 'short' });
        return '<tr><td class="muted">' + (d.user_id ? 'حساب' : 'زائر') + '</td><td>' + t + '</td><td>' + email + '</td></tr>';
      }).join('')
    : '<tr><td colspan="3" class="muted">لا تحميلات بعد</td></tr>';

  const from = new Date(now.getTime() - 13 * 864e5); from.setHours(0, 0, 0, 0);
  const { data: dl } = await supabase.from('downloads')
    .select('created_at').gte('created_at', iso(from)).order('created_at', { ascending: true }).limit(5000);
  const days = {};
  for (let i = 0; i < 14; i++) {
    const d = new Date(from.getTime() + i * 864e5);
    days[d.toLocaleDateString('en-CA')] = { count: 0, label: d.toLocaleDateString('ar', { weekday: 'short', day: 'numeric' }) };
  }
  (dl || []).forEach(d => {
    const k = new Date(d.created_at).toLocaleDateString('en-CA');
    if (days[k]) days[k].count++;
  });
  const max = Math.max(1, ...Object.values(days).map(v => v.count));
  document.getElementById('bars').innerHTML = Object.entries(days).map(([k, v]) =>
    '<div class="bar"><i style="height:' + Math.round(v.count / max * 100) + '%"></i><span>' + v.count + '</span><span class="day">' + v.label + '</span></div>'
  ).join('');

  await loadUsers();
}

let allUsers = [];
async function loadUsers() {
  const { data } = await supabase.from('profiles')
    .select('email, avatar_url, is_admin, created_at, last_seen_at')
    .order('created_at', { ascending: false }).limit(200);
  allUsers = data || [];
  renderUsers();
}
function renderUsers() {
  const q = (document.getElementById('userSearch').value || '').trim().toLowerCase();
  const rows = allUsers.filter(u => !q || (u.email || '').toLowerCase().includes(q));
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = rows.length
    ? rows.map(u => {
        const av = u.avatar_url
          ? '<img class="tbl-avatar" src="' + u.avatar_url + '" alt="">'
          : '<span class="tbl-avatar ph">' + (u.email || '؟').charAt(0).toUpperCase() + '</span>';
        const joined = u.created_at ? new Date(u.created_at).toLocaleString('ar', { dateStyle: 'medium' }) : '—';
        const seen = u.last_seen_at ? new Date(u.last_seen_at).toLocaleString('ar', { dateStyle: 'short', timeStyle: 'short' }) : 'لم يظهر بعد';
        const badge = u.is_admin ? '<span class="badge admin">مشرف</span>' : '<span class="badge user">مستخدم</span>';
        return '<tr><td>' + av + '</td><td>' + (u.email || '—') + '</td><td class="muted">' + joined + '</td><td class="muted">' + seen + '</td><td>' + badge + '</td></tr>';
      }).join('')
    : '<tr><td colspan="5" class="muted">?? ?????? ??? - ???? ?????? ????? ?????????? ????????</td></tr>';
}
// تفعيل النظام عند فتح هذه الصفحة مباشرة
if (typeof initAuth === 'function') initAuth();
else renderStatsGuard();
</script>
</body>
</html>
